<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orion — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e1a;
      color: #f0f4ff;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #00d4ff; font-size: 28px; margin-bottom: 12px; }
    p { color: #8892a4; font-size: 16px; line-height: 1.6; max-width: 320px; }
    .retry {
      margin-top: 32px;
      padding: 12px 32px;
      background: #00d4ff;
      color: #0a0e1a;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">⚡</div>
  <h1>You are offline</h1>
  <p>Orion needs an internet connection to parse APIs and generate intelligence. Please check your connection and try again.</p>
  <button class="retry" onclick="window.location.reload()">Try Again</button>
</body>
</html>
